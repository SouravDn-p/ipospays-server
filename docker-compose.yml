services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: nest-template:latest
    container_name: nest-template-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nest_template
      NODE_ENV: production
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: nest-template-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nest_template
    ports:
      - "5432:5432"
    volumes:
      - nest_template_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nest_template"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nest_template_data:
